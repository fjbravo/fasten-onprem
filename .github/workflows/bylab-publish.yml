# BYLab fork: build bylab/main + publish to GHCR
#
# Owner: fjbravo. Source for context: fjbravo/bylab.io @
# apps/fasten-onprem/README.md ("Image pipeline" section).
#
# No automatic upstream sync — Felix pulls upstream changes manually when
# desired (`git fetch upstream && git merge upstream/main` into bylab/main),
# then pushes, which triggers a fresh build via the push trigger below.
#
# Triggers:
#   - workflow_dispatch: manual rebuild.
#   - push to bylab/main: build → publish.
#   - push to main: build → publish (so resync-from-upstream into main
#     also produces a fresh image, in case bylab/main has diverged but
#     you want the main-tracking tag refreshed).
#
# Branch model:
#   - main          → mirrors fastenhealth/fasten-onprem:main + this
#                     workflow file. Felix merges upstream when ready.
#   - bylab/main    → BYLab feature branch — currently identical to main,
#                     but where BYLab-specific patches will land. The
#                     deployed image is built from this branch.
#
# Image: ghcr.io/fjbravo/fasten-onprem:{latest, bylab-main, sha-<sha>}
# Pulled by docker-03 / Portainer endpoint 9 / stack fasten-onprem.

name: BYLab — publish image from bylab/main

on:
  workflow_dispatch:
  push:
    branches: [main, bylab/main]
    paths-ignore:
      - '.github/workflows/bylab-publish.yml'

concurrency:
  group: bylab-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/fjbravo/fasten-onprem
  BUILD_BRANCH: bylab/main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_BRANCH }}
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # amd64 only — docker-03 is x86_64. Skips the depot.dev multi-arch
          # complexity that upstream's docker.yaml uses for distributing
          # builds to Mac/RPi users.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:bylab-main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
