# BYLab fork: daily upstream sync + GHCR image publish
#
# Owner: fjbravo. Source for context: fjbravo/bylab.io @
# apps/fasten-onprem/README.md ("Image pipeline" section).
#
# Triggers:
#   - schedule (daily 06:00 UTC): merge upstream/main → fork/main → push,
#     then build image from `bylab/main` and publish to GHCR.
#   - workflow_dispatch: same path, manual.
#   - push to bylab/main (the BYLab feature branch — actual source of
#     the deployed image): skip sync, build → publish.
#   - push to main (e.g. from sync-bot itself, though GITHUB_TOKEN pushes
#     don't re-trigger workflows): same as bylab/main path.
#
# Branch model:
#   - main          → mirrors fastenhealth/fasten-onprem:main + this
#                     workflow file. Daily merge from upstream. Never
#                     receives manual code commits.
#   - bylab/main    → BYLab feature branch. Currently identical to main,
#                     but where BYLab-specific patches will land. The
#                     deployed image is built from this branch.
#                     Rebase/merge manually onto main to pick up upstream.
#
# Image: ghcr.io/fjbravo/fasten-onprem:{latest, bylab-main, sha-<sha>}
# Pulled by docker-03 / Portainer endpoint 9 / stack fasten-onprem.

name: BYLab — sync upstream + publish image

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main, bylab/main]
    paths-ignore:
      - '.github/workflows/bylab-sync-and-publish.yml'

concurrency:
  group: bylab-sync-and-publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/fjbravo/fasten-onprem
  BUILD_BRANCH: bylab/main

jobs:
  sync-upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge upstream/main into fork/main
        run: |
          git remote add upstream https://github.com/fastenhealth/fasten-onprem.git
          git fetch upstream main
          BEFORE=$(git rev-parse HEAD)
          if git merge --no-edit upstream/main; then
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "Already up-to-date with upstream."
            else
              git push origin main
            fi
          else
            echo "::error::Merge conflict syncing from upstream. Resolve manually."
            exit 1
          fi

  build-and-push:
    needs: sync-upstream
    if: always() && (github.event_name == 'push' || needs.sync-upstream.result == 'success' || needs.sync-upstream.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_BRANCH }}
          fetch-depth: 1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # amd64 only — docker-03 is x86_64. Skips the depot.dev multi-arch
          # complexity that upstream's docker.yaml uses for distributing
          # builds to Mac/RPi users.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:bylab-main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
